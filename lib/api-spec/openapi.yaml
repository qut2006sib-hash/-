openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Servicna (سرفيسنا) API — shared-taxi ride matching on one demo line in Homs
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: session
  - name: route
  - name: requests
  - name: driver
  - name: admin
paths:
  /auth/options:
    get:
      operationId: getAuthOptions
      tags: [session]
      summary: Available sign-in options; demo accounts only when DEMO_MODE is enabled
      responses:
        "200":
          description: Authentication options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthOptions"

  /auth/demo-login:
    post:
      operationId: demoSignIn
      tags: [session]
      summary: Choose an enabled allowlisted demo account without a password; DEMO_MODE only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSessionInput"
      responses:
        "200":
          description: Database-backed demo session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Demo account unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Demo mode disabled or foreign origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getSession
      tags: [session]
      summary: Current enabled account from a database session
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
  /auth/login:
    post:
      operationId: signIn
      tags: [session]
      summary: Sign in with login name and password (rate limited)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"
        "401":
          description: Invalid credentials or disabled account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: signOut
      tags: [session]
      summary: Sign out
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInfo"

  /route:
    get:
      operationId: getRoute
      tags: [route]
      summary: The demo line with its stops and both directions
      responses:
        "200":
          description: Route
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteDetail"

  /route/suggest:
    post:
      operationId: suggestRoute
      tags: [route]
      summary: Suggest direction, pickup and dropoff stops for an origin and destination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SuggestionInput"
      responses:
        "200":
          description: Suggestions ordered best first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuggestionResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trips/live:
    get:
      operationId: listLiveTrips
      tags: [route]
      summary: Active services on the line with their (simulated) positions
      responses:
        "200":
          description: Live trips
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TripSummary"

  /passenger/active-request:
    get:
      operationId: getActiveRequest
      tags: [requests]
      summary: The signed-in passenger's current request (if any), with events
      responses:
        "200":
          description: Active request state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActiveRequest"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /passenger/history:
    get:
      operationId: listPassengerHistory
      tags: [requests]
      summary: The signed-in passenger's past requests
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Requests, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PassengerHistoryPage"

  /requests:
    post:
      operationId: createRideRequest
      tags: [requests]
      summary: Send a ride request using Idempotency-Key
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RideRequestInput"
      responses:
        "200":
          description: Created (or the existing request for the same clientRequestId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideRequest"
        "400":
          description: Invalid stops for the direction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Passenger already has an active request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /requests/{id}:
    get:
      operationId: getRideRequest
      tags: [requests]
      summary: A request with its status history
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Request detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideRequestDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /requests/{id}/cancel:
    post:
      operationId: cancelRideRequest
      tags: [requests]
      summary: Owner or assigned driver cancels before boarding
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancellationInput" }
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Cancelled request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideRequest"
        "409":
          description: Cannot cancel in the current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /requests/{id}/accept:
    post:
      operationId: acceptRideRequest
      tags: [driver]
      summary: Driver accepts a pending request (atomic; only one driver wins)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Accepted request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideRequest"
        "409":
          description: Already taken, expired, cancelled, or no seats left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /ride-requests/{id}/board:
    post:
      operationId: boardRideRequest
      tags: [requests]
      summary: Owner confirms boarding without code or proximity requirement
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Committed confirmation; replay requires refetching current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideRequest" }
        "400":
          $ref: "#/components/responses/BoardingError"
        "403":
          $ref: "#/components/responses/BoardingError"
        "409":
          $ref: "#/components/responses/BoardingError"
        "410":
          $ref: "#/components/responses/BoardingError"
        "429":
          description: Five wrong attempts within a minute
          headers:
            Retry-After:
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /requests/{id}/board:
    post:
      operationId: legacyBoardRideRequest
      deprecated: true
      tags: [requests]
      summary: Passenger-owned alias; never permits driver confirmation
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Committed confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RideRequest" }
        "400":
          $ref: "#/components/responses/BoardingError"
        "403":
          $ref: "#/components/responses/BoardingError"
        "409":
          $ref: "#/components/responses/BoardingError"
        "410":
          $ref: "#/components/responses/BoardingError"
        "429":
          $ref: "#/components/responses/BoardingError"

  /admin/passengers/{id}:
    get:
      operationId: getAdminPassenger
      tags: [admin]
      summary: Passenger profile and request transitions, never boarding codes
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Passenger and their request details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PassengerProfile" }
        "403":
          $ref: "#/components/responses/BoardingError"
        "404":
          $ref: "#/components/responses/BoardingError"

  /requests/{id}/complete:
    post:
      operationId: completeRideRequest
      tags: [driver]
      summary: Driver marks the passenger dropped off
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RideRequest"
        "409":
          description: Invalid state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/state:
    get:
      operationId: getDriverState
      tags: [driver]
      summary: Signed-in driver's vehicle and active trip
      responses:
        "200":
          description: Driver state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverState"
        "403":
          description: Not a driver
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/trip:
    post:
      operationId: startTrip
      tags: [driver]
      summary: Driver activates a trip in a direction
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TripStartInput"
      responses:
        "200":
          description: Active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "409":
          description: Driver already has an active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/trip/heartbeat:
    post:
      operationId: heartbeatTrip
      tags: [driver]
      summary: Presence only; optional sequenced location has an independent timestamp
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeartbeatInput" }
      responses:
        "200":
          description: Current trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSummary" }

  /driver/trip/external-occupancy:
    patch:
      operationId: updateExternalOccupancy
      tags: [driver]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyInput" }
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSummary" }
        "409":
          description: Version conflict or no capacity; fetch current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /admin/trips/{id}/advance:
    post:
      operationId: stepDemoTrip
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Administration-only simulation in DEMO_MODE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TripSummary" }

  /driver/trip/advance:
    post:
      operationId: advanceTrip
      deprecated: true
      tags: [driver]
      summary: Denied legacy endpoint; use administration-only demo step
      responses:
        "200":
          description: Updated trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "409":
          description: No active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/trip/end:
    post:
      operationId: endTrip
      tags: [driver]
      summary: Reject boarded passengers; cancel accepted passengers with trip_ended
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Ended trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TripSummary"
        "409":
          description: No active trip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /driver/requests:
    get:
      operationId: getDriverRequests
      tags: [driver]
      summary: Pending requests matching the driver's line and direction, plus the driver's own passengers
      responses:
        "200":
          description: Driver requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverRequests"

  /admin/summary:
    get:
      operationId: getAdminSummary
      tags: [admin]
      summary: Counts by status, active services and free seats
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"

  /admin/vehicles:
    get:
      operationId: listAdminVehicles
      tags: [admin]
      summary: All services with their current trip
      responses:
        "200":
          description: Vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VehicleStatus"

  /admin/requests:
    get:
      operationId: listAdminRequests
      tags: [admin]
      summary: All ride requests, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/RequestStatus"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RideRequest"

  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: Recent request status transitions across the system
      responses:
        "200":
          description: Events, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"

  /admin/prepare:
    post:
      operationId: prepareDemo
      tags: [admin]
      summary: Prepare a demo scenario only when no trips or requests exist
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Prepared
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetResult" }

  /admin/reset:
    post:
      operationId: resetDemo
      tags: [admin]
      summary: Atomically delete explicitly demo-marked dynamic rows only
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Reset done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetResult"

components:
  responses:
    BoardingError:
      description: Stable code and Arabic message; no boarding code in errors
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    RequestId:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, including FORBIDDEN, ACTIVE_REQUEST_EXISTS, REQUEST_TAKEN, NO_CAPACITY, REQUEST_EXPIRED, INVALID_DIRECTION, TRIP_STALE, IDEMPOTENCY_CONFLICT
        message: { type: string }
        retryAfter: { type: integer }
        replayed: { type: boolean }

    PassengerProfile:
      type: object
      required: [passenger, requests]
      properties:
        passenger: { $ref: "#/components/schemas/User" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/RideRequestDetail" }

    UserRole:
      type: string
      enum: [passenger, driver, admin]

    RequestStatus:
      type: string
      enum: [pending, accepted, boarded, completed, cancelled, expired]

    TripStatus:
      type: string
      enum: [active, ended]

    DirectionCode:
      type: string
      enum: [to_center, to_waer]

    User:
      type: object
      required: [id, name, role]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        vehicleId: { type: ["integer", "null"] }

    DemoAccount:
      type: object
      required: [loginName, name, role]
      properties:
        loginName: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }

    AuthOptions:
      type: object
      required: [demoMode, accounts]
      properties:
        demoMode: { type: boolean }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/DemoAccount" }

    DemoSessionInput:
      type: object
      additionalProperties: false
      required: [loginName]
      properties:
        loginName: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }

    SessionInfo:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }

    SessionInput:
      type: object
      required: [loginName, password]
      additionalProperties: false
      properties:
        loginName: { type: string, minLength: 1, maxLength: 64, pattern: '^[a-z0-9-]+$' }
        password: { type: string, minLength: 1, maxLength: 128 }

    Stop:
      type: object
      required: [id, directionId, name, seq, lat, lng]
      properties:
        id: { type: integer }
        directionId: { type: integer }
        name: { type: string }
        seq:
          type: integer
          description: Position in this direction's travel order
        lat: { type: number }
        lng: { type: number }

    Direction:
      type: object
      required: [id, code, name, fromName, toName, stopIds, geometry]
      properties:
        id: { type: integer }
        code: { $ref: "#/components/schemas/DirectionCode" }
        name: { type: string }
        fromName: { type: string }
        toName: { type: string }
        stopIds:
          type: array
          description: Stop ids in travel order for this direction
          items: { type: integer }
        geometry:
          type: array
          items: { $ref: "#/components/schemas/GeoPoint" }

    GeoPoint:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }

    PassengerHistoryPage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/RideRequest" }
        page: { type: integer }
        pageSize: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }

    RouteDetail:
      type: object
      required: [id, name, isDemoData, stops, directions]
      properties:
        id: { type: integer }
        name: { type: string }
        isDemoData: { type: boolean }
        stops:
          type: array
          items: { $ref: "#/components/schemas/Stop" }
        directions:
          type: array
          items: { $ref: "#/components/schemas/Direction" }

    TripSummary:
      type: object
      required:
        [id, vehicleId, plate, driverName, directionId, directionName, status, capacity, seatsTaken, seatsFree, currentStopId, currentStopName, lat, lng, lastLocationAt, startedAt, endedAt, isSimulated, externalOccupancy, reservedSeats, boardedSeats, version, progressSequence, lastSeenAt, isStale, locationSource, locationSequence]
      properties:
        replayed: { type: boolean, description: Historical mutation response; refetch current state before rendering }
        id: { type: integer }
        vehicleId: { type: integer }
        plate: { type: string }
        driverName: { type: string }
        directionId: { type: integer }
        directionName: { type: string }
        status: { $ref: "#/components/schemas/TripStatus" }
        capacity: { type: integer }
        seatsTaken: { type: integer }
        seatsFree: { type: integer }
        externalOccupancy: { type: integer }
        reservedSeats: { type: integer }
        boardedSeats: { type: integer }
        version: { type: integer }
        progressSequence: { type: integer }
        lastSeenAt: { type: string, format: date-time }
        isStale: { type: boolean }
        locationSource: { type: string, enum: [gps, simulation, manual] }
        locationSequence: { type: integer }
        currentStopId: { type: integer }
        currentStopName: { type: string }
        lat: { type: number }
        lng: { type: number }
        lastLocationAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        endedAt: { type: ["string", "null"], format: date-time }
        isSimulated: { type: boolean }

    SuggestionInput:
      type: object
      required: [mode]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [coordinates, manual] }
        originLat: { type: number, minimum: -90, maximum: 90 }
        originLng: { type: number, minimum: -180, maximum: 180 }
        destinationLat: { type: number, minimum: -90, maximum: 90 }
        destinationLng: { type: number, minimum: -180, maximum: 180 }
        pickupStopId: { type: integer }
        dropoffStopId: { type: integer }

    TripOption:
      type: object
      required: [tripId, plate, driverName, seatsFree, stopsAway, distanceMeters]
      properties:
        tripId: { type: integer }
        plate: { type: string }
        driverName: { type: string }
        seatsFree: { type: integer }
        stopsAway:
          type: integer
          description: Number of stops between the service and the pickup stop
        distanceMeters: { type: integer }

    RouteSuggestion:
      type: object
      required: [directionId, directionName, pickupStop, dropoffStop, walkToPickupMeters, walkFromDropoffMeters, stopsCount, availableTrips]
      properties:
        directionId: { type: integer }
        directionName: { type: string }
        pickupStop: { $ref: "#/components/schemas/Stop" }
        dropoffStop: { $ref: "#/components/schemas/Stop" }
        walkToPickupMeters: { type: ["integer", "null"] }
        walkFromDropoffMeters: { type: ["integer", "null"] }
        stopsCount:
          type: integer
          description: Stops travelled between pickup and dropoff
        availableTrips:
          type: array
          items: { $ref: "#/components/schemas/TripOption" }

    SuggestionResult:
      type: object
      required: [suggestions, note]
      properties:
        suggestions:
          type: array
          items: { $ref: "#/components/schemas/RouteSuggestion" }
        note:
          type: string
          description: Explanation that distances are straight-line approximations

    RideRequestInput:
      type: object
      required: [directionId, pickupStopId, dropoffStopId]
      properties:
        clientRequestId:
          type: string
          minLength: 8
          description: Client-generated id so retries on weak connections do not create duplicates
        directionId: { type: integer }
        pickupStopId: { type: integer }
        dropoffStopId: { type: integer }

    RideRequest:
      type: object
      required:
        [id, clientRequestId, status, passengerId, passengerName, directionId, directionName, pickupStop, dropoffStop, seats, tripId, vehiclePlate, vehicleLabel, driverName, tripCurrentStopName, stopsAway, createdAt, acceptedAt, boardedAt, completedAt, cancelledAt, expiresAt, cancelReason]
      properties:
        replayed: { type: boolean, description: Historical mutation response; refetch current state before rendering }
        id: { type: integer }
        clientRequestId: { type: string }
        status: { $ref: "#/components/schemas/RequestStatus" }
        passengerId: { type: integer }
        passengerName: { type: ["string", "null"] }
        directionId: { type: integer }
        directionName: { type: string }
        pickupStop: { $ref: "#/components/schemas/Stop" }
        dropoffStop: { $ref: "#/components/schemas/Stop" }
        seats: { type: integer }
        tripId: { type: ["integer", "null"] }
        vehiclePlate: { type: ["string", "null"] }
        vehicleLabel: { type: ["string", "null"] }
        driverId: { type: ["integer", "null"] }
        boardedByDriverId: { type: ["integer", "null"] }
        driverName: { type: ["string", "null"] }
        tripCurrentStopName: { type: ["string", "null"] }
        stopsAway:
          type: ["integer", "null"]
          description: Stops between the accepted service and the pickup stop
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: ["string", "null"], format: date-time }
        boardedAt: { type: ["string", "null"], format: date-time }
        completedAt: { type: ["string", "null"], format: date-time }
        cancelledAt: { type: ["string", "null"], format: date-time }
        expiresAt: { type: string, format: date-time }
        cancelReason: { type: ["string", "null"] }
        terminalReason: { type: ["string", "null"] }
        pickupPassed: { type: boolean }
        version: { type: integer }

    RequestEvent:
      type: object
      required: [id, requestId, fromStatus, toStatus, actorRole, actorName, note, createdAt]
      properties:
        id: { type: integer }
        requestId: { type: integer }
        fromStatus: { type: ["string", "null"] }
        toStatus: { $ref: "#/components/schemas/RequestStatus" }
        actorRole: { type: string, description: "passenger, driver, admin or system" }
        actorName: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    RideRequestDetail:
      type: object
      required: [request, events]
      properties:
        request: { $ref: "#/components/schemas/RideRequest" }
        events:
          type: array
          items: { $ref: "#/components/schemas/RequestEvent" }

    ActiveRequest:
      type: object
      required: [hasActive, events]
      properties:
        hasActive: { type: boolean }
        request: { $ref: "#/components/schemas/RideRequest" }
        events:
          type: array
          items: { $ref: "#/components/schemas/RequestEvent" }

    Vehicle:
      type: object
      required: [id, plate, label, capacity, driverId, driverName]
      properties:
        id: { type: integer }
        plate: { type: string }
        label: { type: string }
        capacity: { type: integer }
        driverId: { type: integer }
        driverName: { type: string }

    DriverState:
      type: object
      required: [driver, vehicle]
      properties:
        driver: { $ref: "#/components/schemas/User" }
        vehicle: { $ref: "#/components/schemas/Vehicle" }
        trip: { $ref: "#/components/schemas/TripSummary" }

    TripStartInput:
      type: object
      required: [directionId]
      properties:
        directionId: { type: integer }
        vehicleId: { type: integer }
        externalOccupied: { type: integer, minimum: 0, default: 0 }

    OccupancyInput:
      type: object
      additionalProperties: false
      required: [tripId, externalOccupied, expectedVersion]
      properties:
        tripId: { type: integer, minimum: 1 }
        externalOccupied: { type: integer, minimum: 0 }
        expectedVersion: { type: integer, minimum: 1 }

    HeartbeatInput:
      type: object
      additionalProperties: false
      required: [tripId]
      properties:
        tripId: { type: integer, minimum: 1 }
        location:
          $ref: "#/components/schemas/LocationSample"

    LocationSample:
      type: object
      additionalProperties: false
      required: [sequence, source, lat, lng, progressSequence]
      properties:
        sequence: { type: integer, minimum: 1 }
        source: { type: string, enum: [gps, simulation, manual] }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        progressSequence: { type: integer, minimum: 1, maximum: 6 }

    CancellationInput:
      type: object
      additionalProperties: false
      properties:
        reason: { type: string, minLength: 1, maxLength: 300 }

    AvailableRequest:
      type: object
      additionalProperties: false
      required: [id, pickupStop, dropoffStop, waitingSeconds]
      properties:
        id: { type: integer }
        pickupStop: { $ref: "#/components/schemas/Stop" }
        dropoffStop: { $ref: "#/components/schemas/Stop" }
        waitingSeconds: { type: integer, minimum: 0 }

    DriverRequests:
      type: object
      required: [tripId, available, mine]
      properties:
        tripId: { type: ["integer", "null"] }
        available:
          type: array
          description: Pending requests on the driver's direction whose pickup is still ahead
          items: { $ref: "#/components/schemas/AvailableRequest" }
        mine:
          type: array
          description: Requests accepted by this driver that are accepted or boarded
          items: { $ref: "#/components/schemas/RideRequest" }

    DirectionLoad:
      type: object
      required: [directionId, directionName, activeTrips, pendingRequests, freeSeats]
      properties:
        directionId: { type: integer }
        directionName: { type: string }
        activeTrips: { type: integer }
        pendingRequests: { type: integer }
        freeSeats: { type: integer }

    AdminSummary:
      type: object
      required:
        [activeTrips, totalVehicles, pendingRequests, acceptedRequests, boardedRequests, completedRequests, cancelledRequests, expiredRequests, freeSeats, directions]
      properties:
        activeTrips: { type: integer }
        totalVehicles: { type: integer }
        pendingRequests: { type: integer }
        acceptedRequests: { type: integer }
        boardedRequests: { type: integer }
        completedRequests: { type: integer }
        cancelledRequests: { type: integer }
        expiredRequests: { type: integer }
        freeSeats: { type: integer }
        directions:
          type: array
          items: { $ref: "#/components/schemas/DirectionLoad" }

    VehicleStatus:
      type: object
      required: [vehicle, activeRequests]
      properties:
        vehicle: { $ref: "#/components/schemas/Vehicle" }
        trip: { $ref: "#/components/schemas/TripSummary" }
        activeRequests: { type: integer }

    ActivityEvent:
      type: object
      required: [id, requestId, fromStatus, toStatus, actorRole, actorName, note, createdAt, passengerName, pickupStopName, dropoffStopName]
      properties:
        id: { type: integer }
        requestId: { type: integer }
        fromStatus: { type: ["string", "null"] }
        toStatus: { $ref: "#/components/schemas/RequestStatus" }
        actorRole: { type: string }
        actorName: { type: string }
        note: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
        passengerName: { type: string }
        pickupStopName: { type: string }
        dropoffStopName: { type: string }

    ResetResult:
      type: object
      required: [ok, message]
      properties:
        replayed: { type: boolean }
        ok: { type: boolean }
        message: { type: string }
